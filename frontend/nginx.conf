server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Backend-Prefix ist bereits /api (siehe backend/app/api/*.py) — proxy_pass
    # ohne Pfad hinter dem Hostnamen leitet die volle Original-URI weiter.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gebaute Assets tragen einen Content-Hash im Dateinamen (Vite) — dauerhaft
    # cachebar, ohne Gefahr veralteter Assets nach einem Deploy.
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-Fallback für react-router-dom (Client-Side-Routing).
    location / {
        try_files $uri /index.html;
    }
}
